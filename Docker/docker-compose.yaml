services:
    db_sql:
        image: mysql:8.0
        container_name: db_sql
        restart: always
        environment:
          MYSQL_DATABASE: ${DATABASE}
          PMA_HOST: db_sql
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${PMA_USER}", "-p${PMA_PASSWORD}"]
          interval: 10s
          timeout: 5s
          retries: 5
        ports:
          - "3306:3306"
        volumes:
          - db_data:/var/lib/mysql
          # Path on host: ./init.sql, Path in container: /docker-entrypoint-initdb.d/scripts/init.sql
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: unless-stopped
        ports:
          - "8080:80" 
        environment:
          - PMA_HOST=db_sql
          - PMA_PORT=3306
          - PMA_ARBITRARY=1
          - PMA_USER=${PMA_USER}
          - PMA_PASSWORD=${PMA_PASSWORD}
        depends_on:
          - db_sql

    db_postgres:
        image: postgres:18
        container_name: db_postgres
        restart: unless-stopped
        environment:
          POSTGRES_DB: ${DATABASE}
          POSTGRES_USER: ${POSTGRES_USER}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          PGDATA: /var/lib/postgresql/data/pgdata
        healthcheck: 
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DATABASE}"]
          interval: 10s
          timeout: 5s
          retries: 5
        ports:
          - "5432:5432"
        volumes:
          - "db-postgres:/var/lib/postgresql/data"
    
    pgadmin:
        image: dpage/pgadmin4:9.18
        ports:
          - 5050:80
        environment:
          PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
          PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
           # Don't require the user to login
          PGADMIN_CONFIG_SERVER_MODE: 'False'
          # Don't require a "master" password after logging in
          PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        depends_on:
          - db_postgres

    python_migrator:
        image: python:3.11
        build: .
        container_name: python_migrator
        restart: no # All scripts will be executed only ones and the container will stop.
        environment:
          - MYSQL_HOST=db_sql
          - MYSQL_PORT=3306
          - MYSQL_USER=${PMA_USER}
          - MYSQL_PASSWORD=${PMA_PASSWORD}
          - MYSQL_DATABASE=${DATABASE}
          - POSTGRES_HOST=db_postgres
          - POSTGRES_PORT=5432
          - POSTGRES_USER=${POSTGRES_USER}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - POSTGRES_DB=${DATABASE}
        depends_on:
          db_sql:
            condition: service_healthy
          db_postgres:
            condition: service_healthy  
        volumes:
          - ./script:/app/script

volumes:
  db_data:
  db-postgres: