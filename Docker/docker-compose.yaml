version: '3.8'

services:
    db-sql:
        image: mysql:5.7.11
        container_name: db_sql
        restart: always
        environment:
          MYSQL_DATABASE: db_formule1
          MYSQL_ROOT_PASSWORD: 
        ports:
          - "3306:3306"
        volumes:
          - db_data:/var/lib/mysql
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: always
        ports:
          - "8080:80" 
        environment:
          - PMA_HOST=db_sql
          - PMA_PORT=3306
          - PMA_ARBITRARY=1
        depends_on:
          - db_sql
          - db-postgres

    db-postgres:
        image: postgres:18
        container_name: db_postgres
        restart: always
        environment:
          POSTGRES_DB: db_formule1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 
        ports:
          - "5432:5432"
        volumes:
          - db_data:/var/lib/postgresql/data
    
    pgadmin:
        image: dpage/pgadmin4:9.8
        ports:
          - 5050:80
        environment:
          PGADMIN_DEFAULT_EMAIL: admin@example.com
          PGADMIN_DEFAULT_PASSWORD: admin
           # Don't require the user to login
          PGADMIN_CONFIG_SERVER_MODE: 'False'
          # Don't require a "master" password after logging in
          PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
        depends_on:
          - db-postgres

    python-migrator:
        image: python:3.11
        build: ./python-migrator
        container_name: python_migrator
        restart: on-failure
        depends_on:
          - db-sql
          - db-postgres

volumes:
  db_data: